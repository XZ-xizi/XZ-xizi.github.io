<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>像素化工坊 · 移动优化 · 平滑保存</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #2b3a4a 0%, #1d2a35 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 20px 16px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            width: 100%;
            max-width: 500px;
            color: white;
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin: 0 0 4px 0;
            color: #ffd966;
        }
        .sub {
            text-align: center;
            opacity: 0.8;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }
        .upload-area {
            border: 2px dashed rgba(255,255,255,0.4);
            border-radius: 24px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 16px;
        }
        .upload-area:active {
            background: rgba(255,255,255,0.1);
        }
        .upload-area.dragover {
            border-color: #4caf50;
            background: rgba(76,175,80,0.1);
        }
        .preview-box {
            margin: 16px 0;
            background: #1e2a36;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .canvas-wrapper {
            width: 100%;
            background: #10161c;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #result-canvas {
            display: block;
            max-width: 100%;
            max-height: 40vh;
            width: auto;
            height: auto;
            background: #fff;
            border-radius: 4px;
        }
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .control-row label {
            width: 100px;
            font-size: 0.95rem;
        }
        input[type="number"] {
            background: #2d3e4f;
            border: 1px solid #5f7a92;
            color: white;
            padding: 8px 10px;
            border-radius: 24px;
            font-size: 0.95rem;
            width: 120px;
        }
        .toggle-switch {
            width: 52px;
            height: 26px;
            background: #555;
            border-radius: 26px;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }
        .toggle-switch.active {
            background: #4caf50;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.2s;
        }
        .toggle-switch.active::after {
            left: 28px;
        }
        button {
            background: #e67e22;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #f39c12;
            min-width: 120px;
            touch-action: manipulation;
        }
        button:active {
            transform: scale(0.96);
        }
        button:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        button.secondary {
            background: #2c3e50;
            border-color: #5f7a92;
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .status {
            font-size: 0.85rem;
            opacity: 0.8;
            text-align: center;
            margin-top: 10px;
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 6px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hint {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 5px;
            text-align: center;
        }
        /* 图片放大预览弹窗（可拖拽缩放） */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            overflow: hidden;
            touch-action: none;
        }
        .modal-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }
        .modal-content:active {
            cursor: grabbing;
        }
        #modal-image {
            transform-origin: 0 0;
            transition: none;
            will-change: transform;
            pointer-events: none;
            max-width: none;
            max-height: none;
            background: #fff;
        }
        .close-modal {
            position: absolute;
            top: 12px;
            right: 20px;
            color: #f1f1f1;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-modal:active {
            background: rgba(255,255,255,0.2);
        }
        .zoom-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
        }
        .save-info {
            font-size: 0.75rem;
            color: #aaa;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 像素化工坊</h1>
        <div class="sub">移动优化 · 预览保存皆平滑</div>

        <div class="upload-area" id="upload-area">
            <p style="font-size: 1.1rem; margin:0;">📁 点击或拖拽图片</p>
            <p style="opacity:0.7; margin:4px 0 0;">支持 JPG, PNG, WebP</p>
            <input type="file" id="file-input" accept="image/*" style="display: none;">
        </div>

        <div class="preview-box" id="preview-box" style="display: none;">
            <div class="canvas-wrapper" id="canvas-wrapper" title="点击放大预览">
                <canvas id="result-canvas"></canvas>
            </div>
            <div class="hint">点击图片放大，可拖拽查看</div>
        </div>

        <div class="control-panel">
            <div class="control-row">
                <label>📐 短边像素数</label>
                <input type="number" id="pixel-size" min="2" max="1000" value="128">
            </div>
            <div class="control-row">
                <label>🎨 颜色数量</label>
                <input type="number" id="color-count" min="2" max="1000" value="32">
            </div>
            <div class="control-row">
                <label>🤖 高质量</label>
                <div class="toggle-switch" id="toggle-ai"></div>
                <span style="opacity:0.7; font-size:0.8rem;">(更多迭代)</span>
            </div>
            <div class="button-group">
                <button id="generate-btn" disabled>⚡ 生成</button>
                <button id="save-btn" class="secondary" disabled>💾 保存平滑图</button>
            </div>
            <div class="status" id="status">请上传图片</div>
            <div class="save-info">预览与保存均为平滑风格，格子大小12px</div>
        </div>
    </div>

    <div id="image-modal" class="modal">
        <span class="close-modal">&times;</span>
        <div class="modal-content" id="modal-content">
            <img id="modal-image" src="" alt="放大预览">
        </div>
        <div class="zoom-hint">双指缩放 | 拖拽移动</div>
    </div>

    <script>
        (function() {
            // ---------- 配置 ----------
            const MIN_BRIGHTNESS = 150;          // 提亮阈值
            const SAVE_CELL_SIZE = 12;            // 保存时格子大小
            const PREVIEW_SCALE = 4;               // 预览画布放大倍数（用于平滑渲染）

            // ---------- 状态 ----------
            let originalImage = null;
            let pixelatedGrid = null; // { grid, palette, width, height }
            let isProcessing = false;
            let aiMode = false;

            // 模态框状态
            let modalImage = document.getElementById('modal-image');
            let modal = document.getElementById('image-modal');
            let modalContent = document.getElementById('modal-content');
            let scale = 1;
            let translateX = 0;
            let translateY = 0;
            let isDragging = false;
            let startX, startY;

            // DOM 元素
            const uploadArea = document.getElementById('upload-area');
            const fileInput = document.getElementById('file-input');
            const previewBox = document.getElementById('preview-box');
            const canvasWrapper = document.getElementById('canvas-wrapper');
            const resultCanvas = document.getElementById('result-canvas');
            const ctx = resultCanvas.getContext('2d');
            const pixelSizeInput = document.getElementById('pixel-size');
            const colorCountInput = document.getElementById('color-count');
            const toggleAI = document.getElementById('toggle-ai');
            const generateBtn = document.getElementById('generate-btn');
            const saveBtn = document.getElementById('save-btn');
            const statusDiv = document.getElementById('status');
            const closeModal = document.querySelector('.close-modal');

            // ---------- AI开关 ----------
            toggleAI.addEventListener('click', () => {
                aiMode = !aiMode;
                toggleAI.classList.toggle('active', aiMode);
            });
            toggleAI.classList.toggle('active', aiMode);

            // ---------- 模态框拖拽缩放逻辑 ----------
            function updateModalTransform() {
                modalImage.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            }

            // 鼠标/触摸事件
            modalContent.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                e.preventDefault();
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                modalContent.style.cursor = 'grabbing';
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                updateModalTransform();
            });
            window.addEventListener('mouseup', () => {
                isDragging = false;
                modalContent.style.cursor = 'grab';
            });

            modalContent.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    e.preventDefault();
                    isDragging = true;
                    startX = e.touches[0].clientX - translateX;
                    startY = e.touches[0].clientY - translateY;
                    modalContent.style.cursor = 'grabbing';
                }
            });
            modalContent.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                e.preventDefault();
                translateX = e.touches[0].clientX - startX;
                translateY = e.touches[0].clientY - startY;
                updateModalTransform();
            });
            modalContent.addEventListener('touchend', () => {
                isDragging = false;
                modalContent.style.cursor = 'grab';
            });

            // 滚轮缩放
            modal.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = modalImage.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = Math.min(5, Math.max(0.5, scale * delta));
                const scaleRatio = newScale / scale;
                translateX -= (mouseX - translateX) * (scaleRatio - 1);
                translateY -= (mouseY - translateY) * (scaleRatio - 1);
                scale = newScale;
                updateModalTransform();
            });

            // 双指缩放
            let initialPinchDistance = null;
            modal.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    initialPinchDistance = Math.sqrt(dx*dx + dy*dy);
                }
            });
            modal.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && initialPinchDistance) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    const pinchScale = distance / initialPinchDistance;
                    const newScale = Math.min(5, Math.max(0.5, scale * pinchScale));
                    const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    const rect = modalImage.getBoundingClientRect();
                    const mouseX = centerX - rect.left;
                    const mouseY = centerY - rect.top;
                    const scaleRatio = newScale / scale;
                    translateX -= (mouseX - translateX) * (scaleRatio - 1);
                    translateY -= (mouseY - translateY) * (scaleRatio - 1);
                    scale = newScale;
                    updateModalTransform();
                    initialPinchDistance = distance;
                }
            });
            modal.addEventListener('touchend', () => {
                initialPinchDistance = null;
            });

            // 点击画布打开弹窗
            canvasWrapper.addEventListener('click', () => {
                if (pixelatedGrid) {
                    modalImage.src = resultCanvas.toDataURL('image/png');
                    modal.style.display = 'block';
                    scale = 1;
                    translateX = 0;
                    translateY = 0;
                    updateModalTransform();
                }
            });

            closeModal.addEventListener('click', () => {
                modal.style.display = 'none';
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });

            // ---------- 工具函数 ----------
            function rgbToHex(r, g, b) {
                return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            }

            // 以下为像素化算法（复制自涂色游戏）
            function initializeCentroids(pixels, k) {
                const centroids = [];
                centroids.push({...pixels[Math.floor(Math.random() * pixels.length)]});
                for (let i = 1; i < k; i++) {
                    const distances = new Array(pixels.length);
                    let totalDist = 0;
                    for (let j = 0; j < pixels.length; j++) {
                        let minDist = Infinity;
                        for (let c = 0; c < centroids.length; c++) {
                            const dr = pixels[j].r - centroids[c].r;
                            const dg = pixels[j].g - centroids[c].g;
                            const db = pixels[j].b - centroids[c].b;
                            const dist = dr*dr + dg*dg + db*db;
                            if (dist < minDist) minDist = dist;
                        }
                        distances[j] = minDist;
                        totalDist += minDist;
                    }
                    let rand = Math.random() * totalDist;
                    let cumulative = 0;
                    for (let j = 0; j < pixels.length; j++) {
                        cumulative += distances[j];
                        if (cumulative >= rand) {
                            centroids.push({...pixels[j]});
                            break;
                        }
                    }
                }
                return centroids;
            }

            function kMeans(pixels, k, maxIterations = 30) {
                if (pixels.length === 0) return { centroids: [], labels: [] };
                let centroids = initializeCentroids(pixels, k);
                let labels = new Array(pixels.length).fill(0);
                let changed = true;
                let iter = 0;
                while (changed && iter < maxIterations) {
                    changed = false;
                    iter++;
                    for (let i = 0; i < pixels.length; i++) {
                        let minDist = Infinity;
                        let bestIdx = 0;
                        for (let j = 0; j < k; j++) {
                            const dr = pixels[i].r - centroids[j].r;
                            const dg = pixels[i].g - centroids[j].g;
                            const db = pixels[i].b - centroids[j].b;
                            const dist = dr*dr + dg*dg + db*db;
                            if (dist < minDist) {
                                minDist = dist;
                                bestIdx = j;
                            }
                        }
                        if (labels[i] !== bestIdx) {
                            labels[i] = bestIdx;
                            changed = true;
                        }
                    }
                    const sums = new Array(k).fill(0).map(() => ({r:0, g:0, b:0, count:0}));
                    for (let i = 0; i < pixels.length; i++) {
                        const label = labels[i];
                        sums[label].r += pixels[i].r;
                        sums[label].g += pixels[i].g;
                        sums[label].b += pixels[i].b;
                        sums[label].count++;
                    }
                    for (let j = 0; j < k; j++) {
                        if (sums[j].count > 0) {
                            centroids[j] = {
                                r: Math.round(sums[j].r / sums[j].count),
                                g: Math.round(sums[j].g / sums[j].count),
                                b: Math.round(sums[j].b / sums[j].count)
                            };
                        } else {
                            centroids[j] = {...pixels[Math.floor(Math.random() * pixels.length)]};
                        }
                    }
                }
                return { centroids, labels };
            }

            function brightenPaletteWithCluster(pixels, labels, centroids) {
                const k = centroids.length;
                const clusterPixels = new Array(k).fill().map(() => []);
                for (let i = 0; i < pixels.length; i++) {
                    clusterPixels[labels[i]].push(pixels[i]);
                }
                for (let j = 0; j < k; j++) {
                    const brightness = centroids[j].r + centroids[j].g + centroids[j].b;
                    if (brightness < MIN_BRIGHTNESS && clusterPixels[j].length > 0) {
                        let brightest = clusterPixels[j][0];
                        let maxBright = brightest.r + brightest.g + brightest.b;
                        for (let p of clusterPixels[j]) {
                            const b = p.r + p.g + p.b;
                            if (b > maxBright) {
                                maxBright = b;
                                brightest = p;
                            }
                        }
                        centroids[j] = {...brightest};
                    }
                }
                return centroids;
            }

            // 像素化主函数（同步执行，返回网格和调色板）
            function pixelateImageSync(imageData, width, height, targetColors, highQuality) {
                const pixels = [];
                for (let i = 0; i < imageData.data.length; i += 4) {
                    pixels.push({
                        r: imageData.data[i],
                        g: imageData.data[i+1],
                        b: imageData.data[i+2]
                    });
                }
                const maxIter = highQuality ? 50 : 30;
                const { centroids, labels } = kMeans(pixels, targetColors, maxIter);
                const brightCentroids = brightenPaletteWithCluster(pixels, labels, centroids);
                const palette = brightCentroids.map(c => ({
                    ...c,
                    hex: rgbToHex(c.r, c.g, c.b)
                }));
                const newLabels = new Array(pixels.length);
                for (let i = 0; i < pixels.length; i++) {
                    let bestIdx = 0;
                    let bestDist = Infinity;
                    for (let j = 0; j < brightCentroids.length; j++) {
                        const dr = pixels[i].r - brightCentroids[j].r;
                        const dg = pixels[i].g - brightCentroids[j].g;
                        const db = pixels[i].b - brightCentroids[j].b;
                        const dist = dr*dr + dg*dg + db*db;
                        if (dist < bestDist) {
                            bestDist = dist;
                            bestIdx = j;
                        }
                    }
                    newLabels[i] = bestIdx;
                }
                const grid = [];
                let idx = 0;
                for (let y = 0; y < height; y++) {
                    const row = [];
                    for (let x = 0; x < width; x++) {
                        row.push(newLabels[idx++]);
                    }
                    grid.push(row);
                }
                return { grid, palette };
            }

            // ---------- 预览绘制（平滑）----------
            function drawSmoothPreview(grid, palette) {
                const height = grid.length;
                const width = grid[0].length;
                // 创建原始1px画布
                const srcCanvas = document.createElement('canvas');
                srcCanvas.width = width;
                srcCanvas.height = height;
                const srcCtx = srcCanvas.getContext('2d');
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const colorIdx = grid[y][x];
                        srcCtx.fillStyle = palette[colorIdx].hex;
                        srcCtx.fillRect(x, y, 1, 1);
                    }
                }
                // 绘制到目标画布（放大 PREVIEW_SCALE 倍，平滑）
                const previewWidth = width * PREVIEW_SCALE;
                const previewHeight = height * PREVIEW_SCALE;
                resultCanvas.width = previewWidth;
                resultCanvas.height = previewHeight;
                ctx.imageSmoothingEnabled = true;
                ctx.drawImage(srcCanvas, 0, 0, previewWidth, previewHeight);
            }

            // ---------- 保存绘制（同样平滑，保持绵绵感）----------
            function generateHighResSmoothImage(grid, palette) {
                const height = grid.length;
                const width = grid[0].length;
                // 原始1px画布
                const srcCanvas = document.createElement('canvas');
                srcCanvas.width = width;
                srcCanvas.height = height;
                const srcCtx = srcCanvas.getContext('2d');
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const colorIdx = grid[y][x];
                        srcCtx.fillStyle = palette[colorIdx].hex;
                        srcCtx.fillRect(x, y, 1, 1);
                    }
                }
                // 放大到保存尺寸（平滑）
                const destCanvas = document.createElement('canvas');
                destCanvas.width = width * SAVE_CELL_SIZE;
                destCanvas.height = height * SAVE_CELL_SIZE;
                const destCtx = destCanvas.getContext('2d');
                destCtx.imageSmoothingEnabled = true; // 平滑
                destCtx.drawImage(srcCanvas, 0, 0, destCanvas.width, destCanvas.height);
                return destCanvas;
            }

            // ---------- 事件绑定 ----------
            uploadArea.addEventListener('click', () => fileInput.click());
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    handleImage(file);
                } else {
                    statusDiv.innerText = '请上传图片文件';
                }
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) handleImage(file);
            });

            function handleImage(file) {
                statusDiv.innerText = '加载图片中...';
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        originalImage = img;
                        statusDiv.innerText = '图片已加载，可以生成';
                        generateBtn.disabled = false;
                        saveBtn.disabled = true;
                        previewBox.style.display = 'flex';
                        ctx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }

            // 生成按钮节流
            let lastClickTime = 0;
            generateBtn.addEventListener('click', async () => {
                const now = Date.now();
                if (now - lastClickTime < 1000) return; // 1秒内不能重复点击
                lastClickTime = now;

                if (!originalImage) {
                    statusDiv.innerText = '请先上传图片';
                    return;
                }
                if (isProcessing) return;

                const targetShort = parseInt(pixelSizeInput.value);
                const targetColors = parseInt(colorCountInput.value);
                if (targetShort < 2 || targetColors < 2) {
                    statusDiv.innerText = '像素数和颜色数必须至少为2';
                    return;
                }

                isProcessing = true;
                generateBtn.disabled = true;
                saveBtn.disabled = true;
                statusDiv.innerHTML = '正在像素化 <span class="loading-spinner"></span>';

                // 使用 setTimeout 让出UI线程
                setTimeout(() => {
                    try {
                        let targetW, targetH;
                        const aspect = originalImage.width / originalImage.height;
                        if (aspect >= 1) {
                            targetH = targetShort;
                            targetW = Math.round(targetShort * aspect);
                        } else {
                            targetW = targetShort;
                            targetH = Math.round(targetShort / aspect);
                        }

                        const offCanvas = document.createElement('canvas');
                        offCanvas.width = targetW;
                        offCanvas.height = targetH;
                        const offCtx = offCanvas.getContext('2d');
                        offCtx.drawImage(originalImage, 0, 0, targetW, targetH);
                        const imageData = offCtx.getImageData(0, 0, targetW, targetH);

                        const result = pixelateImageSync(imageData, targetW, targetH, targetColors, aiMode);
                        pixelatedGrid = {
                            grid: result.grid,
                            palette: result.palette,
                            width: targetW,
                            height: targetH
                        };
                        drawSmoothPreview(result.grid, result.palette);
                        statusDiv.innerText = `完成！${targetW}x${targetH} · ${result.palette.length}色`;
                        saveBtn.disabled = false;
                    } catch (error) {
                        console.error(error);
                        statusDiv.innerText = '处理失败，请重试';
                    } finally {
                        isProcessing = false;
                        generateBtn.disabled = false;
                    }
                }, 10);
            });

            saveBtn.addEventListener('click', () => {
                if (!pixelatedGrid) return;
                const highResCanvas = generateHighResSmoothImage(pixelatedGrid.grid, pixelatedGrid.palette);
                const link = document.createElement('a');
                link.download = `pixel_${pixelatedGrid.width}x${pixelatedGrid.height}_${pixelatedGrid.palette.length}colors.png`;
                link.href = highResCanvas.toDataURL('image/png');
                link.click();
            });

            // 输入范围限制
            colorCountInput.addEventListener('change', () => {
                let val = parseInt(colorCountInput.value);
                if (isNaN(val)) val = 32;
                val = Math.min(1000, Math.max(2, val));
                colorCountInput.value = val;
            });
            pixelSizeInput.addEventListener('change', () => {
                let val = parseInt(pixelSizeInput.value);
                if (isNaN(val)) val = 128;
                val = Math.min(1000, Math.max(2, val));
                pixelSizeInput.value = val;
            });
        })();
    </script>
</body>
</html>
