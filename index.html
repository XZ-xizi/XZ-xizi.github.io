<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>像素涂色 · 移动优化版</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #2b3a4a 0%, #1d2a35 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        #home-screen {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            width: 600px;
            max-width: 90vw;
            transition: all 0.3s;
        }
        .home-title {
            color: white;
            font-size: 3rem;
            font-weight: 800;
            text-align: center;
            margin: 0 0 20px 0;
            text-shadow: 0 4px 10px rgba(0,0,0,0.4);
            letter-spacing: 4px;
        }
        .home-sub {
            color: rgba(255,255,255,0.7);
            text-align: center;
            margin-bottom: 40px;
            font-style: italic;
        }
        .home-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .home-btn {
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 18px 40px;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.2s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            flex: 1;
            text-align: center;
        }
        .home-btn:hover {
            background: rgba(255,255,255,0.3);
            border-color: white;
            transform: scale(1.02);
        }
        #settings-modal, #confirm-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: #2d3e4f;
            padding: 30px;
            border-radius: 40px;
            width: 450px;
            max-width: 90%;
            color: white;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            border: 1px solid #7f8c8d;
        }
        .modal-card h2 {
            margin-top: 0;
            text-align: center;
            color: #ffd966;
        }
        .setting-item {
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .setting-item label {
            font-size: 1.2rem;
        }
        .toggle-switch {
            width: 60px;
            height: 30px;
            background: #555;
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }
        .toggle-switch.active {
            background: #4caf50;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.2s;
        }
        .toggle-switch.active::after {
            left: 32px;
        }
        .slider-value {
            font-size: 14px;
            background: #3a4a5a;
            padding: 4px 12px;
            border-radius: 20px;
            margin-left: 10px;
        }
        .number-input {
            width: 80px;
            padding: 5px;
            border-radius: 8px;
            border: none;
            background: #3a4a5a;
            color: white;
            font-size: 1rem;
            text-align: center;
        }
        .settings-close {
            background: #e67e22;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            font-size: 1.2rem;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        .modal-btn {
            padding: 10px 25px;
            border-radius: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        .modal-btn.confirm {
            background: #e67e22;
            color: white;
        }
        .modal-btn.cancel {
            background: #7f8c8d;
            color: white;
        }
        #game-screen {
            display: none;
            width: 100%;
            height: 100vh;
            background: #1e2a36;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            color: white;
        }
        .game-header {
            padding: 16px 24px;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #4a5c6b;
            flex-wrap: wrap;
        }
        .back-button {
            background: #2c3e50;
            border: 1px solid #5f7a92;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .back-button:hover {
            background: #3a4a5a;
        }
        .progress-area {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 200px;
        }
        .progress-bar-bg {
            height: 16px;
            background: #3a4a5a;
            border-radius: 30px;
            flex: 1;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6fcf97, #2ecc71);
            border-radius: 30px;
            transition: width 0.1s;
        }
        .game-toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .game-toolbar button {
            background: #2c3e50;
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            border: 1px solid #5f7a92;
            transition: 0.1s;
        }
        .game-toolbar button.active {
            background: #e67e22;
            border-color: #f39c12;
        }
        #color-palette-container {
            padding: 12px 24px;
            background: #233240;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid #3a4e60;
            max-height: 100px;
            overflow-y: auto;
        }
        .palette-swatch {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 3px black;
            cursor: pointer;
            border: 3px solid transparent;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            flex-shrink: 0;
            transition: 0.1s;
        }
        .palette-swatch.selected {
            border-color: #ffd966;
            transform: scale(1.05);
        }
        .palette-swatch.completed {
            display: none;
        }
        .canvas-container {
            width: 100%;
            height: calc(100vh - 200px);
            overflow: auto;
            position: relative;
            background: #10161c;
            cursor: crosshair;
            touch-action: none;
        }
        #game-canvas {
            display: block;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            transform-origin: 0 0;
        }
        .info-text {
            font-size: 14px;
            color: #b0c4de;
            margin-left: 15px;
        }
        .ai-indicator {
            background: #27ae60;
            color: white;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 12px;
            margin-left: 10px;
            display: inline-block;
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
            font-size: 24px;
            flex-direction: column;
            gap: 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 主页内容与PC版类似，省略以节省篇幅，实际需完整包含 -->
    <!-- 为了简洁，此处仅展示核心差异，实际使用时请复制PC版的HTML结构，并替换script内容为下方移动版脚本 -->
    <!-- 注意：移动版HTML头部需包含 viewport 设置，已在上面体现 -->
    <!-- 以下只给出JavaScript部分，HTML结构同PC版但需保留所有元素 -->
    <script>
        (function() {
            // ---------- 配置 ----------
            const MIN_BRIGHTNESS = 150;
            const LINE_COLOR = '#888';
            const UNPAINTED_BG_NEAR = '#ffffff';
            const UNPAINTED_BG_FAR = '#f0f0f0';
            const HIGHLIGHT_COLOR = '#e0e0e0';

            // ---------- 全局状态 ----------
            let currentSettings = { mistakeOff: false, bigBrush: false, aiMode: false };
            let imageLoaded = false;
            let originalGrid = [], paintedGrid = [], mistakeGrid = [], originalBrightness = [];
            let gridWidth = 0, gridHeight = 0;
            let cellSize = 12, viewScale = 1.0, cellDrawSize = 12;
            let currentTool = 'normal';
            let currentColorIndex = 0;
            let colorPalette = [];
            let actionLog = [];

            // 触摸状态
            let touchActive = false;
            let touchStartX = 0, touchStartY = 0;
            let touchStartTime = 0;
            let longPressTimer = null;
            let isLongPressing = false;
            let isTouchMoving = false;
            let lastTouchX = 0, lastTouchY = 0;
            let initialPinchDistance = 0;
            let lastPaintTime = 0;
            const PAINT_INTERVAL = 30; // 涂色节流间隔（毫秒）

            // DOM 元素（与PC版相同）
            const homeScreen = document.getElementById('home-screen');
            const gameScreen = document.getElementById('game-screen');
            const settingsModal = document.getElementById('settings-modal');
            const confirmModal = document.getElementById('confirm-modal');
            const loadingOverlay = document.getElementById('loading-overlay');
            const fileInput = document.getElementById('file-input');
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('canvas-container');
            const paletteDiv = document.getElementById('color-palette-container');
            const progressFill = document.getElementById('progress-fill');
            const progressPercent = document.getElementById('progress-percent');
            const aiIndicator = document.getElementById('ai-indicator');
            const backButton = document.getElementById('back-to-home');
            const confirmExit = document.getElementById('confirm-exit');
            const cancelExit = document.getElementById('cancel-exit');
            const toolNormal = document.getElementById('tool-normal');
            const toolBrush = document.getElementById('tool-brush');
            const toolBucket = document.getElementById('tool-bucket');
            const toolMagnifier = document.getElementById('tool-magnifier');
            const toolFillAll = document.getElementById('tool-fillall');

            // 细节度控件
            const detailSlider = document.getElementById('detail-slider');
            const detailInput = document.getElementById('detail-input');
            function syncDetail(value) {
                value = Math.min(80, Math.max(5, parseInt(value) || 20));
                detailSlider.value = value;
                detailInput.value = value;
            }
            detailSlider.addEventListener('input', () => syncDetail(detailSlider.value));
            detailInput.addEventListener('input', () => syncDetail(detailInput.value));
            syncDetail(20);

            const gridSizeInput = document.getElementById('grid-size-input');

            // ---------- 工具函数（与PC版相同，略）----------
            // 实际应包含完整的pixelateImage等函数，此处为占位
            async function pixelateImage(imageData, width, height, targetColors, useAI) {
                // 模拟处理
                return new Promise(resolve => {
                    setTimeout(() => {
                        const grid = [], brightGrid = [];
                        for (let y=0; y<height; y++) {
                            const row = [], brightRow = [];
                            for (let x=0; x<width; x++) {
                                row.push(0);
                                brightRow.push(128);
                            }
                            grid.push(row);
                            brightGrid.push(brightRow);
                        }
                        const palette = [{r:255,g:0,b:0,hex:'#ff0000'}];
                        resolve({ grid, palette, brightnessGrid: brightGrid });
                    }, 100);
                });
            }

            function buildPaletteFromColors(colors) { /* 同PC版 */ }
            function updateCompletedColors() { /* 同PC版 */ }
            function drawGrid() { /* 同PC版 */ }
            function updateProgress() { /* 同PC版 */ }

            function applyScale() {
                const rawSize = cellSize * viewScale;
                cellDrawSize = Math.max(1, Math.floor(rawSize));
                canvas.width = gridWidth * cellDrawSize;
                canvas.height = gridHeight * cellDrawSize;
                canvas.style.width = canvas.width + 'px';
                canvas.style.height = canvas.height + 'px';
                drawGrid();
            }

            // 缩放函数（用于双指，直接应用）
            function zoom(delta, centerX, centerY) {
                const rect = canvas.getBoundingClientRect();
                const canvasX = (centerX - rect.left) * (canvas.width / rect.width);
                const canvasY = (centerY - rect.top) * (canvas.height / rect.height);
                const oldScale = viewScale;
                const newScale = viewScale * delta;
                const containerW = container.clientWidth, containerH = container.clientHeight;
                const minScaleW = containerW / (gridWidth * cellSize);
                const minScaleH = containerH / (gridHeight * cellSize);
                const minScale = Math.max(0.1, Math.min(minScaleW, minScaleH));
                const maxScale = 8.0;
                viewScale = Math.min(maxScale, Math.max(minScale, newScale));
                const ratio = viewScale / oldScale;
                container.scrollLeft += canvasX * (ratio - 1);
                container.scrollTop += canvasY * (ratio - 1);
                applyScale();
            }

            // 涂色核心（带节流）
            function tryPaint(x, y) {
                const now = Date.now();
                if (now - lastPaintTime < PAINT_INTERVAL) return false;
                if (x<0||x>=gridWidth||y<0||y>=gridHeight) return false;
                const orig = originalGrid[y][x];
                if (paintedGrid[y][x] !== -1) return false;
                if (currentColorIndex < 0 || currentColorIndex >= colorPalette.length) return false;
                if (currentColorIndex === orig) {
                    paintedGrid[y][x] = currentColorIndex;
                    mistakeGrid[y][x] = false;
                    actionLog.push({type:'paint',x,y,color:currentColorIndex,correct:true});
                } else {
                    if (currentSettings.mistakeOff) return false;
                    else {
                        mistakeGrid[y][x] = true;
                        actionLog.push({type:'paint',x,y,color:currentColorIndex,correct:false});
                    }
                }
                lastPaintTime = now;
                return true;
            }

            function normalTool(x, y) { if (tryPaint(x,y)) { drawGrid(); updateCompletedColors(); } }
            function brushTool(centerX, centerY) {
                const targetOrig = originalGrid[centerY][centerX];
                let painted = false;
                for (let y=0; y<gridHeight; y++) {
                    for (let x=0; x<gridWidth; x++) {
                        if (originalGrid[y][x] === targetOrig) {
                            if (currentSettings.bigBrush) {
                                for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) {
                                    const nx=x+dx, ny=y+dy;
                                    if (nx>=0&&nx<gridWidth&&ny>=0&&ny<gridHeight&&originalGrid[ny][nx]===targetOrig) {
                                        if (tryPaint(nx,ny)) painted = true;
                                    }
                                }
                            } else {
                                if (tryPaint(x,y)) painted = true;
                            }
                        }
                    }
                }
                if (painted) { drawGrid(); updateCompletedColors(); }
            }
            function bucketTool(startX, startY) {
                const targetOrig = originalGrid[startY][startX];
                const queue = [{x:startX, y:startY}];
                const visited = new Set();
                let painted = false;
                while (queue.length) {
                    const {x,y} = queue.shift();
                    const key = `${x},${y}`;
                    if (visited.has(key)) continue;
                    visited.add(key);
                    if (originalGrid[y][x] === targetOrig) {
                        if (currentSettings.bigBrush) {
                            for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) {
                                const nx=x+dx, ny=y+dy;
                                if (nx>=0&&nx<gridWidth&&ny>=0&&ny<gridHeight&&originalGrid[ny][nx]===targetOrig) {
                                    if (tryPaint(nx,ny)) painted = true;
                                }
                            }
                        } else {
                            if (tryPaint(x,y)) painted = true;
                        }
                        if (y>0) queue.push({x, y:y-1});
                        if (y<gridHeight-1) queue.push({x, y:y+1});
                        if (x>0) queue.push({x:x-1, y});
                        if (x<gridWidth-1) queue.push({x:x+1, y});
                    }
                }
                if (painted) { drawGrid(); updateCompletedColors(); }
            }
            function magnifierTool() {
                const candidates = [];
                for (let y=0; y<gridHeight; y++) for (let x=0; x<gridWidth; x++) if (originalGrid[y][x]===currentColorIndex && paintedGrid[y][x]===-1) candidates.push({x,y});
                if (candidates.length===0) { alert('当前颜色已全部涂完！'); return; }
                const {x,y} = candidates[Math.floor(Math.random()*candidates.length)];
                ctx.save();
                ctx.strokeStyle='#FFD700'; ctx.lineWidth=4;
                ctx.strokeRect(x*cellDrawSize-2, y*cellDrawSize-2, cellDrawSize+4, cellDrawSize+4);
                ctx.restore();
                const containerRect = container.getBoundingClientRect();
                container.scrollTo({left: x*cellDrawSize - containerRect.width/2, top: y*cellDrawSize - containerRect.height/2, behavior:'smooth'});
                setTimeout(()=>drawGrid(),1500);
            }
            function fillAll() {
                for (let y=0; y<gridHeight; y++) for (let x=0; x<gridWidth; x++) if (paintedGrid[y][x]===-1) paintedGrid[y][x] = originalGrid[y][x];
                drawGrid(); updateCompletedColors();
                actionLog.push({type:'fillall'});
            }
            function saveImage() {
                const link = document.createElement('a');
                link.download = `pixel_art_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }
            function goBackToHome() {
                confirmModal.style.display = 'none';
                imageLoaded = false;
                originalGrid = []; paintedGrid = []; mistakeGrid = []; originalBrightness = []; colorPalette = [];
                paletteDiv.innerHTML = '';
                ctx.clearRect(0,0,canvas.width,canvas.height);
                gameScreen.style.display = 'none';
                homeScreen.style.display = 'block';
            }

            // 设置开关（同PC版）
            const toggleMistake = document.getElementById('toggle-mistake');
            const toggleBigbrush = document.getElementById('toggle-bigbrush');
            const toggleAI = document.getElementById('toggle-ai');
            function updateToggleUI() {
                toggleMistake.classList.toggle('active', currentSettings.mistakeOff);
                toggleBigbrush.classList.toggle('active', currentSettings.bigBrush);
                toggleAI.classList.toggle('active', currentSettings.aiMode);
                aiIndicator.style.display = currentSettings.aiMode ? 'inline-block' : 'none';
            }
            toggleMistake.addEventListener('click',()=>{ currentSettings.mistakeOff = !currentSettings.mistakeOff; updateToggleUI(); if(imageLoaded) drawGrid(); });
            toggleBigbrush.addEventListener('click',()=>{ currentSettings.bigBrush = !currentSettings.bigBrush; updateToggleUI(); });
            toggleAI.addEventListener('click',()=>{ currentSettings.aiMode = !currentSettings.aiMode; updateToggleUI(); });
            updateToggleUI();

            document.getElementById('home-settings-btn').addEventListener('click',()=> settingsModal.style.display='flex');
            document.getElementById('game-settings-btn').addEventListener('click',()=> settingsModal.style.display='flex');
            document.getElementById('close-settings').addEventListener('click',()=>{ settingsModal.style.display='none'; if(imageLoaded) drawGrid(); });
            backButton.addEventListener('click',()=>{ if(imageLoaded) confirmModal.style.display='flex'; else { gameScreen.style.display='none'; homeScreen.style.display='block'; } });
            confirmExit.addEventListener('click', goBackToHome);
            cancelExit.addEventListener('click',()=> confirmModal.style.display='none');
            confirmModal.addEventListener('click',(e)=>{ if(e.target===confirmModal) confirmModal.style.display='none'; });

            // 图片导入（同PC版）
            document.getElementById('import-btn').addEventListener('click',()=> fileInput.click());
            fileInput.addEventListener('change', async function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const img = new Image();
                    img.onload = async () => {
                        let gridBase = parseInt(gridSizeInput.value) || 126;
                        let gridW, gridH;
                        const aspect = img.width / img.height;
                        if (Math.abs(aspect-1)<0.1) { gridW = gridH = gridBase; }
                        else if (img.width > img.height) { gridH = gridBase; gridW = Math.round(gridBase*aspect); }
                        else { gridW = gridBase; gridH = Math.round(gridBase/aspect); }
                        gridWidth = gridW; gridHeight = gridH;
                        const offCanvas = document.createElement('canvas');
                        offCanvas.width = gridW; offCanvas.height = gridH;
                        const offCtx = offCanvas.getContext('2d');
                        offCtx.drawImage(img,0,0,gridW,gridH);
                        const imageData = offCtx.getImageData(0,0,gridW,gridH);
                        let targetColors = parseInt(detailInput.value);
                        targetColors = Math.min(80, Math.max(5, targetColors));
                        try {
                            loadingOverlay.style.display = 'flex';
                            const result = await pixelateImage(imageData, gridW, gridH, targetColors, currentSettings.aiMode);
                            originalGrid = result.grid;
                            colorPalette = result.palette;
                            originalBrightness = result.brightnessGrid;
                            buildPaletteFromColors(colorPalette);
                            paintedGrid = originalGrid.map(row=>row.map(()=>-1));
                            mistakeGrid = originalGrid.map(row=>row.map(()=>false));
                            actionLog = [];
                            imageLoaded = true;
                            viewScale = 1.0;
                            cellSize = 12;
                            applyScale();
                            updateCompletedColors();
                            loadingOverlay.style.display = 'none';
                            homeScreen.style.display = 'none';
                            gameScreen.style.display = 'block';
                        } catch(error) {
                            console.error(error);
                            alert('处理失败');
                            loadingOverlay.style.display = 'none';
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // ---------- 触摸事件 ----------
            function getGridCoord(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const mouseX = (clientX - rect.left) * scaleX;
                const mouseY = (clientY - rect.top) * scaleY;
                const gridX = Math.floor(mouseX / cellDrawSize);
                const gridY = Math.floor(mouseY / cellDrawSize);
                if (gridX>=0 && gridX<gridWidth && gridY>=0 && gridY<gridHeight) return {x:gridX, y:gridY};
                return null;
            }

            function handleTouchStart(e) {
                e.preventDefault();
                const touches = e.touches;
                if (touches.length === 1) {
                    const touch = touches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                    touchStartTime = Date.now();
                    touchActive = true;
                    isTouchMoving = false;
                    isLongPressing = false;

                    if (longPressTimer) clearTimeout(longPressTimer);
                    longPressTimer = setTimeout(() => {
                        if (touchActive && !isTouchMoving) {
                            isLongPressing = true;
                            const pos = getGridCoord(touch.clientX, touch.clientY);
                            if (pos) {
                                if (currentTool === 'normal') normalTool(pos.x, pos.y);
                                else if (currentTool === 'brush') brushTool(pos.x, pos.y);
                                else if (currentTool === 'bucket') bucketTool(pos.x, pos.y);
                                // 注意：fillAll 和 magnifier 不需要长按触发，它们有独立按钮
                            }
                        }
                    }, 300);
                } else if (touches.length === 2) {
                    const dx = touches[0].clientX - touches[1].clientX;
                    const dy = touches[0].clientY - touches[1].clientY;
                    initialPinchDistance = Math.sqrt(dx*dx + dy*dy);
                    if (longPressTimer) clearTimeout(longPressTimer);
                    touchActive = false;
                    isLongPressing = false;
                }
            }

            function handleTouchMove(e) {
                e.preventDefault();
                const touches = e.touches;
                if (touches.length === 1 && touchActive) {
                    const touch = touches[0];
                    const dx = touch.clientX - lastTouchX;
                    const dy = touch.clientY - lastTouchY;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist > 5) {
                        isTouchMoving = true;
                        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
                        container.scrollBy(-dx, -dy);
                        lastTouchX = touch.clientX;
                        lastTouchY = touch.clientY;
                    }

                    if (isLongPressing) {
                        const pos = getGridCoord(touch.clientX, touch.clientY);
                        if (pos) {
                            if (currentTool === 'normal') normalTool(pos.x, pos.y);
                            else if (currentTool === 'brush') brushTool(pos.x, pos.y);
                            else if (currentTool === 'bucket') bucketTool(pos.x, pos.y);
                        }
                    }
                } else if (touches.length === 2) {
                    const dx = touches[0].clientX - touches[1].clientX;
                    const dy = touches[0].clientY - touches[1].clientY;
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    if (initialPinchDistance > 0) {
                        const scale = distance / initialPinchDistance;
                        const centerX = (touches[0].clientX + touches[1].clientX) / 2;
                        const centerY = (touches[0].clientY + touches[1].clientY) / 2;
                        zoom(scale, centerX, centerY);
                        initialPinchDistance = distance; // 增量式缩放
                    }
                }
            }

            function handleTouchEnd(e) {
                e.preventDefault();
                const touches = e.touches;
                if (touches.length === 0) {
                    // 所有手指抬起
                    if (touchActive && !isTouchMoving && !isLongPressing && longPressTimer) {
                        // 单击涂色
                        clearTimeout(longPressTimer);
                        const touch = e.changedTouches[0];
                        const pos = getGridCoord(touch.clientX, touch.clientY);
                        if (pos) {
                            if (currentTool === 'normal') normalTool(pos.x, pos.y);
                            else if (currentTool === 'brush') brushTool(pos.x, pos.y);
                            else if (currentTool === 'bucket') bucketTool(pos.x, pos.y);
                            else if (currentTool === 'fillall') fillAll(); // 修正：fillAll 可通过按钮触发，这里也允许手指单击触发？但按钮已经存在，为了安全，这里不处理 fillAll
                            else if (currentTool === 'magnifier') magnifierTool();
                        }
                    }
                    touchActive = false;
                    isLongPressing = false;
                    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
                } else if (touches.length === 1) {
                    // 从双指变为单指
                    touchActive = true;
                    isTouchMoving = false;
                    isLongPressing = false;
                    const touch = touches[0];
                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                    touchStartTime = Date.now();
                }
                initialPinchDistance = 0;
            }

            canvas.addEventListener('touchstart', handleTouchStart);
            canvas.addEventListener('touchmove', handleTouchMove);
            canvas.addEventListener('touchend', handleTouchEnd);
            canvas.addEventListener('touchcancel', handleTouchEnd);

            // 工具切换
            toolNormal.addEventListener('click',()=>{ document.querySelectorAll('.game-toolbar button').forEach(b=>b.classList.remove('active')); toolNormal.classList.add('active'); currentTool='normal'; });
            toolBrush.addEventListener('click',()=>{ document.querySelectorAll('.game-toolbar button').forEach(b=>b.classList.remove('active')); toolBrush.classList.add('active'); currentTool='brush'; });
            toolBucket.addEventListener('click',()=>{ document.querySelectorAll('.game-toolbar button').forEach(b=>b.classList.remove('active')); toolBucket.classList.add('active'); currentTool='bucket'; });
            toolMagnifier.addEventListener('click',()=>{ document.querySelectorAll('.game-toolbar button').forEach(b=>b.classList.remove('active')); toolMagnifier.classList.add('active'); currentTool='magnifier'; if(imageLoaded) magnifierTool(); });
            toolFillAll.addEventListener('click',()=>{ document.querySelectorAll('.game-toolbar button').forEach(b=>b.classList.remove('active')); toolFillAll.classList.add('active'); currentTool='fillall'; fillAll(); }); // 点击按钮直接执行

            document.getElementById('save-btn').addEventListener('click', saveImage);

            window.showLog = ()=>console.table(actionLog);
        })();
    </script>
</body>
</html>
