<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>像素化工坊 · 源自涂色游戏 · 高清保存</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #2b3a4a 0%, #1d2a35 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 24px 20px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            width: 100%;
            max-width: 800px;
            color: white;
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin: 0 0 8px 0;
            color: #ffd966;
        }
        .sub {
            text-align: center;
            opacity: 0.8;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .upload-area {
            border: 2px dashed rgba(255,255,255,0.4);
            border-radius: 30px;
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            border-color: #ffd966;
            background: rgba(255,255,255,0.05);
        }
        .upload-area.dragover {
            border-color: #4caf50;
            background: rgba(76,175,80,0.1);
        }
        .preview-box {
            margin: 20px 0;
            background: #1e2a36;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .canvas-wrapper {
            width: 100%;
            overflow: hidden;
            background: #10161c;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #result-canvas {
            display: block;
            max-width: 100%;
            max-height: 50vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #fff;
            object-fit: contain;
        }
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .control-row label {
            width: 120px;
            font-size: 1rem;
        }
        input[type="number"] {
            background: #2d3e4f;
            border: 1px solid #5f7a92;
            color: white;
            padding: 10px 12px;
            border-radius: 30px;
            font-size: 1rem;
            width: 140px;
        }
        .toggle-switch {
            width: 60px;
            height: 30px;
            background: #555;
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }
        .toggle-switch.active {
            background: #4caf50;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.2s;
        }
        .toggle-switch.active::after {
            left: 32px;
        }
        button {
            background: #e67e22;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #f39c12;
            min-width: 140px;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        button.secondary {
            background: #2c3e50;
            border-color: #5f7a92;
        }
        button.secondary:hover {
            background: #3a4a5a;
        }
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .status {
            font-size: 0.9rem;
            opacity: 0.8;
            text-align: center;
            margin-top: 12px;
        }
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hint {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-top: 5px;
            text-align: center;
        }
        /* 图片放大预览弹窗（可拖拽） */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            overflow: hidden;
            touch-action: none;
        }
        .modal-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }
        .modal-content:active {
            cursor: grabbing;
        }
        #modal-image {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transform-origin: 0 0;
            transition: none;
            will-change: transform;
            pointer-events: none;
            max-width: none;
            max-height: none;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }
        .close-modal:hover,
        .close-modal:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
        .zoom-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
        }
        .save-info {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 像素化工坊</h1>
        <div class="sub">源自涂色游戏 · 原汁原味 · 高清保存</div>

        <!-- 上传区域 -->
        <div class="upload-area" id="upload-area">
            <p style="font-size: 1.2rem; margin:0;">📁 点击或拖拽图片</p>
            <p style="opacity:0.7; margin:5px 0 0;">支持 JPG, PNG, WebP</p>
            <input type="file" id="file-input" accept="image/*" style="display: none;">
        </div>

        <!-- 预览区 -->
        <div class="preview-box" id="preview-box" style="display: none;">
            <div class="canvas-wrapper" id="canvas-wrapper" title="点击放大预览">
                <canvas id="result-canvas"></canvas>
            </div>
            <div class="hint">点击图片进入预览，可拖拽查看各个角落</div>
        </div>

        <!-- 控制区 -->
        <div class="control-panel">
            <div class="control-row">
                <label>📐 短边像素数</label>
                <input type="number" id="pixel-size" min="2" max="1000" value="128">
            </div>
            <div class="control-row">
                <label>🎨 颜色数量</label>
                <input type="number" id="color-count" min="2" max="1000" value="32">
            </div>
            <div class="control-row">
                <label>🤖 高质量</label>
                <div class="toggle-switch" id="toggle-ai"></div>
                <span style="opacity:0.7; font-size:0.9rem;">(更多迭代)</span>
            </div>
            <div class="button-group">
                <button id="generate-btn" disabled>⚡ 生成</button>
                <button id="save-btn" class="secondary" disabled>💾 保存高清图</button>
            </div>
            <div class="status" id="status">请上传图片</div>
            <div class="save-info">保存为12倍放大版，每个格子12像素，清晰锐利</div>
        </div>
    </div>

    <!-- 图片放大预览弹窗（可拖拽缩放） -->
    <div id="image-modal" class="modal">
        <span class="close-modal">&times;</span>
        <div class="modal-content" id="modal-content">
            <img id="modal-image" src="" alt="放大预览">
        </div>
        <div class="zoom-hint">滚轮缩放 | 拖拽移动</div>
    </div>

    <script>
        (function() {
            // ---------- 配置 ----------
            const MIN_BRIGHTNESS = 150; // 涂色游戏用的提亮阈值
            const SAVE_CELL_SIZE = 12;    // 保存时每个格子的大小（像素）
            const PREVIEW_CELL_SIZE = 1;   // 预览时每个格子大小（通过CSS缩放，实际画布像素）

            // ---------- 状态 ----------
            let originalImage = null;
            let pixelatedGrid = null; // { grid, palette, width, height }
            let isProcessing = false;
            let aiMode = false;

            // 模态框状态
            let modalImage = document.getElementById('modal-image');
            let modal = document.getElementById('image-modal');
            let modalContent = document.getElementById('modal-content');
            let scale = 1;
            let translateX = 0;
            let translateY = 0;
            let isDragging = false;
            let startX, startY;

            // DOM 元素
            const uploadArea = document.getElementById('upload-area');
            const fileInput = document.getElementById('file-input');
            const previewBox = document.getElementById('preview-box');
            const canvasWrapper = document.getElementById('canvas-wrapper');
            const resultCanvas = document.getElementById('result-canvas');
            const ctx = resultCanvas.getContext('2d');
            const pixelSizeInput = document.getElementById('pixel-size');
            const colorCountInput = document.getElementById('color-count');
            const toggleAI = document.getElementById('toggle-ai');
            const generateBtn = document.getElementById('generate-btn');
            const saveBtn = document.getElementById('save-btn');
            const statusDiv = document.getElementById('status');
            const closeModal = document.querySelector('.close-modal');

            // ---------- AI开关 ----------
            toggleAI.addEventListener('click', () => {
                aiMode = !aiMode;
                toggleAI.classList.toggle('active', aiMode);
            });
            toggleAI.classList.toggle('active', aiMode);

            // ---------- 模态框拖拽缩放逻辑 ----------
            function updateModalTransform() {
                modalImage.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            }

            modalContent.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                modalContent.style.cursor = 'grabbing';
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                updateModalTransform();
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                modalContent.style.cursor = 'grab';
            });

            // 触摸事件
            modalContent.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX - translateX;
                    startY = e.touches[0].clientY - translateY;
                    modalContent.style.cursor = 'grabbing';
                    e.preventDefault();
                }
            });
            modalContent.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                translateX = e.touches[0].clientX - startX;
                translateY = e.touches[0].clientY - startY;
                updateModalTransform();
                e.preventDefault();
            });
            modalContent.addEventListener('touchend', () => {
                isDragging = false;
                modalContent.style.cursor = 'grab';
            });

            // 滚轮缩放
            modal.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = modalImage.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = Math.min(5, Math.max(0.5, scale * delta));
                const scaleRatio = newScale / scale;
                translateX -= (mouseX - translateX) * (scaleRatio - 1);
                translateY -= (mouseY - translateY) * (scaleRatio - 1);
                scale = newScale;
                updateModalTransform();
            });

            // 双指缩放
            let initialPinchDistance = null;
            modal.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    initialPinchDistance = Math.sqrt(dx*dx + dy*dy);
                }
            });
            modal.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && initialPinchDistance) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    const pinchScale = distance / initialPinchDistance;
                    const newScale = Math.min(5, Math.max(0.5, scale * pinchScale));
                    const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    const rect = modalImage.getBoundingClientRect();
                    const mouseX = centerX - rect.left;
                    const mouseY = centerY - rect.top;
                    const scaleRatio = newScale / scale;
                    translateX -= (mouseX - translateX) * (scaleRatio - 1);
                    translateY -= (mouseY - translateY) * (scaleRatio - 1);
                    scale = newScale;
                    updateModalTransform();
                    initialPinchDistance = distance;
                }
            });
            modal.addEventListener('touchend', () => {
                initialPinchDistance = null;
            });

            // 点击画布打开弹窗
            canvasWrapper.addEventListener('click', () => {
                if (pixelatedGrid) {
                    // 弹窗中显示的是预览画布的内容，也是1像素/格，但通过CSS放大，清晰度足够
                    modalImage.src = resultCanvas.toDataURL('image/png');
                    modal.style.display = 'block';
                    scale = 1;
                    translateX = 0;
                    translateY = 0;
                    updateModalTransform();
                }
            });

            closeModal.addEventListener('click', () => {
                modal.style.display = 'none';
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });

            // ---------- 工具函数 ----------
            function rgbToHex(r, g, b) {
                return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            }

            // K-means++ 初始化（与原作一致）
            function initializeCentroids(pixels, k) {
                const centroids = [];
                centroids.push({...pixels[Math.floor(Math.random() * pixels.length)]});
                for (let i = 1; i < k; i++) {
                    const distances = new Array(pixels.length);
                    let totalDist = 0;
                    for (let j = 0; j < pixels.length; j++) {
                        let minDist = Infinity;
                        for (let c = 0; c < centroids.length; c++) {
                            const dr = pixels[j].r - centroids[c].r;
                            const dg = pixels[j].g - centroids[c].g;
                            const db = pixels[j].b - centroids[c].b;
                            const dist = dr*dr + dg*dg + db*db;
                            if (dist < minDist) minDist = dist;
                        }
                        distances[j] = minDist;
                        totalDist += minDist;
                    }
                    let rand = Math.random() * totalDist;
                    let cumulative = 0;
                    for (let j = 0; j < pixels.length; j++) {
                        cumulative += distances[j];
                        if (cumulative >= rand) {
                            centroids.push({...pixels[j]});
                            break;
                        }
                    }
                }
                return centroids;
            }

            // K-means 聚类
            function kMeans(pixels, k, maxIterations = 30) {
                if (pixels.length === 0) return { centroids: [], labels: [] };
                
                let centroids = initializeCentroids(pixels, k);
                let labels = new Array(pixels.length).fill(0);
                let changed = true;
                let iter = 0;
                
                while (changed && iter < maxIterations) {
                    changed = false;
                    iter++;
                    
                    for (let i = 0; i < pixels.length; i++) {
                        let minDist = Infinity;
                        let bestIdx = 0;
                        for (let j = 0; j < k; j++) {
                            const dr = pixels[i].r - centroids[j].r;
                            const dg = pixels[i].g - centroids[j].g;
                            const db = pixels[i].b - centroids[j].b;
                            const dist = dr*dr + dg*dg + db*db;
                            if (dist < minDist) {
                                minDist = dist;
                                bestIdx = j;
                            }
                        }
                        if (labels[i] !== bestIdx) {
                            labels[i] = bestIdx;
                            changed = true;
                        }
                    }
                    
                    const sums = new Array(k).fill(0).map(() => ({r:0, g:0, b:0, count:0}));
                    for (let i = 0; i < pixels.length; i++) {
                        const label = labels[i];
                        sums[label].r += pixels[i].r;
                        sums[label].g += pixels[i].g;
                        sums[label].b += pixels[i].b;
                        sums[label].count++;
                    }
                    
                    for (let j = 0; j < k; j++) {
                        if (sums[j].count > 0) {
                            centroids[j] = {
                                r: Math.round(sums[j].r / sums[j].count),
                                g: Math.round(sums[j].g / sums[j].count),
                                b: Math.round(sums[j].b / sums[j].count)
                            };
                        } else {
                            centroids[j] = {...pixels[Math.floor(Math.random() * pixels.length)]};
                        }
                    }
                }
                return { centroids, labels };
            }

            // 提亮过暗颜色（与原作一致）
            function brightenPaletteWithCluster(pixels, labels, centroids) {
                const k = centroids.length;
                const clusterPixels = new Array(k).fill().map(() => []);
                for (let i = 0; i < pixels.length; i++) {
                    clusterPixels[labels[i]].push(pixels[i]);
                }
                
                for (let j = 0; j < k; j++) {
                    const brightness = centroids[j].r + centroids[j].g + centroids[j].b;
                    if (brightness < MIN_BRIGHTNESS && clusterPixels[j].length > 0) {
                        let brightest = clusterPixels[j][0];
                        let maxBright = brightest.r + brightest.g + brightest.b;
                        for (let p of clusterPixels[j]) {
                            const b = p.r + p.g + p.b;
                            if (b > maxBright) {
                                maxBright = b;
                                brightest = p;
                            }
                        }
                        centroids[j] = {...brightest};
                    }
                }
                return centroids;
            }

            // 像素化主函数（完全复制涂色游戏流程）
            async function pixelateImage(imageData, width, height, targetColors, highQuality) {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        const pixels = [];
                        for (let i = 0; i < imageData.data.length; i += 4) {
                            pixels.push({
                                r: imageData.data[i],
                                g: imageData.data[i+1],
                                b: imageData.data[i+2]
                            });
                        }
                        
                        const maxIter = highQuality ? 50 : 30;
                        const { centroids, labels } = kMeans(pixels, targetColors, maxIter);
                        
                        // 提亮过暗颜色
                        const brightCentroids = brightenPaletteWithCluster(pixels, labels, centroids);
                        
                        // 构建调色板
                        const palette = brightCentroids.map(c => ({
                            ...c,
                            hex: rgbToHex(c.r, c.g, c.b)
                        }));

                        // 重新分配标签（因为质心变了）
                        const newLabels = new Array(pixels.length);
                        for (let i = 0; i < pixels.length; i++) {
                            let bestIdx = 0;
                            let bestDist = Infinity;
                            for (let j = 0; j < brightCentroids.length; j++) {
                                const dr = pixels[i].r - brightCentroids[j].r;
                                const dg = pixels[i].g - brightCentroids[j].g;
                                const db = pixels[i].b - brightCentroids[j].b;
                                const dist = dr*dr + dg*dg + db*db;
                                if (dist < bestDist) {
                                    bestDist = dist;
                                    bestIdx = j;
                                }
                            }
                            newLabels[i] = bestIdx;
                        }

                        // 构建网格
                        const grid = [];
                        let idx = 0;
                        for (let y = 0; y < height; y++) {
                            const row = [];
                            for (let x = 0; x < width; x++) {
                                row.push(newLabels[idx++]);
                            }
                            grid.push(row);
                        }
                        
                        resolve({ grid, palette });
                    }, 0);
                });
            }

            // 将网格绘制到预览画布（每个格子1像素，保持界面小巧）
            function drawPreview(grid, palette) {
                const height = grid.length;
                const width = grid[0].length;
                resultCanvas.width = width * PREVIEW_CELL_SIZE;
                resultCanvas.height = height * PREVIEW_CELL_SIZE;
                ctx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
                
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const colorIdx = grid[y][x];
                        if (colorIdx >= 0 && colorIdx < palette.length) {
                            ctx.fillStyle = palette[colorIdx].hex;
                        } else {
                            ctx.fillStyle = '#000';
                        }
                        ctx.fillRect(x * PREVIEW_CELL_SIZE, y * PREVIEW_CELL_SIZE, PREVIEW_CELL_SIZE, PREVIEW_CELL_SIZE);
                    }
                }
            }

            // 生成高清保存图片（每个格子12像素）
            function generateHighResImage(grid, palette) {
                const height = grid.length;
                const width = grid[0].length;
                const canvas = document.createElement('canvas');
                canvas.width = width * SAVE_CELL_SIZE;
                canvas.height = height * SAVE_CELL_SIZE;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = false; // 保持像素感
                
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const colorIdx = grid[y][x];
                        if (colorIdx >= 0 && colorIdx < palette.length) {
                            ctx.fillStyle = palette[colorIdx].hex;
                        } else {
                            ctx.fillStyle = '#000';
                        }
                        ctx.fillRect(x * SAVE_CELL_SIZE, y * SAVE_CELL_SIZE, SAVE_CELL_SIZE, SAVE_CELL_SIZE);
                    }
                }
                return canvas;
            }

            // ---------- 事件绑定 ----------
            uploadArea.addEventListener('click', () => fileInput.click());

            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    handleImage(file);
                } else {
                    statusDiv.innerText = '请上传图片文件';
                }
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) handleImage(file);
            });

            function handleImage(file) {
                statusDiv.innerText = '加载图片中...';
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        originalImage = img;
                        statusDiv.innerText = '图片已加载，可以生成';
                        generateBtn.disabled = false;
                        saveBtn.disabled = true;
                        previewBox.style.display = 'flex';
                        ctx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }

            generateBtn.addEventListener('click', async () => {
                if (!originalImage) {
                    statusDiv.innerText = '请先上传图片';
                    return;
                }
                if (isProcessing) return;

                const targetShort = parseInt(pixelSizeInput.value);
                const targetColors = parseInt(colorCountInput.value);
                if (targetShort < 2 || targetColors < 2) {
                    statusDiv.innerText = '像素数和颜色数必须至少为2';
                    return;
                }

                isProcessing = true;
                generateBtn.disabled = true;
                saveBtn.disabled = true;
                statusDiv.innerHTML = '正在像素化 <span class="loading-spinner"></span>';

                let targetW, targetH;
                const aspect = originalImage.width / originalImage.height;
                if (aspect >= 1) {
                    targetH = targetShort;
                    targetW = Math.round(targetShort * aspect);
                } else {
                    targetW = targetShort;
                    targetH = Math.round(targetShort / aspect);
                }

                const offCanvas = document.createElement('canvas');
                offCanvas.width = targetW;
                offCanvas.height = targetH;
                const offCtx = offCanvas.getContext('2d');
                offCtx.drawImage(originalImage, 0, 0, targetW, targetH);
                const imageData = offCtx.getImageData(0, 0, targetW, targetH);

                try {
                    const result = await pixelateImage(imageData, targetW, targetH, targetColors, aiMode);
                    pixelatedGrid = {
                        grid: result.grid,
                        palette: result.palette,
                        width: targetW,
                        height: targetH
                    };
                    drawPreview(result.grid, result.palette);
                    statusDiv.innerText = `完成！${targetW}x${targetH} · ${result.palette.length}色`;
                    saveBtn.disabled = false;
                } catch (error) {
                    console.error(error);
                    statusDiv.innerText = '处理失败，请重试';
                } finally {
                    isProcessing = false;
                    generateBtn.disabled = false;
                }
            });

            saveBtn.addEventListener('click', () => {
                if (!pixelatedGrid) return;
                const highResCanvas = generateHighResImage(pixelatedGrid.grid, pixelatedGrid.palette);
                const link = document.createElement('a');
                link.download = `pixel_${pixelatedGrid.width}x${pixelatedGrid.height}_${pixelatedGrid.palette.length}colors.png`;
                link.href = highResCanvas.toDataURL('image/png');
                link.click();
            });

            colorCountInput.addEventListener('change', () => {
                let val = parseInt(colorCountInput.value);
                if (isNaN(val)) val = 32;
                val = Math.min(1000, Math.max(2, val));
                colorCountInput.value = val;
            });
            pixelSizeInput.addEventListener('change', () => {
                let val = parseInt(pixelSizeInput.value);
                if (isNaN(val)) val = 128;
                val = Math.min(1000, Math.max(2, val));
                pixelSizeInput.value = val;
            });
        })();
    </script>
</body>
</html>
